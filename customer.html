<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b2b"><link rel="stylesheet" href="style.css"><title>Swarajya Cafe | Chai Rewards</title></head><body class="customer-body"><main class="customer-shell"><div class="customer-brand"><div class="brand-mark">SC</div><p class="eyebrow">SWARAJYA CAFE</p><h1>Chai Rewards</h1><p class="muted">Collect 6 chai stamps and enjoy 1 free chai.</p></div><section class="panel customer-panel"><div id="customerStatus" class="status-message" aria-live="polite">Checking your loyalty card…</div><form id="customerForm" class="form-stack" hidden><label>Your name<input id="customerName" autocomplete="name" maxlength="80" required placeholder="Enter your name"></label><label>Mobile number<input id="customerMobile" inputmode="numeric" autocomplete="tel" maxlength="10" required placeholder="10-digit mobile number"></label><button class="btn btn-primary">Register and request today's stamp</button></form><div id="returningCustomer" hidden><p class="customer-greeting" id="customerGreeting"></p><p class="muted" id="customerMobileText"></p><button id="requestStamp" class="btn btn-primary btn-wide">Request today's chai stamp</button><button id="changeCustomer" class="text-button" type="button">Not you? Change customer</button></div><div id="customerProgress" hidden></div></section><p class="tiny muted customer-foot">Please show the request confirmation to cafe staff. A stamp is added only after approval.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="customer.js"></script></body></html>
